name: Build, test and deploy PK Valves Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkvalves-website-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Download repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore PKValves.sln

      - name: Build solution
        run: dotnet build PKValves.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test PKValves.Tests/PKValves.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Publish website
        run: dotnet publish PKValves/PKValves.csproj --configuration Release --no-build --no-restore --output ./publish/website

      - name: Upload website deployment files
        uses: actions/upload-artifact@v4
        with:
          name: pkvalves-website
          path: ./publish/website
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy website to Azure
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/master'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download website deployment files
        uses: actions/download-artifact@v4
        with:
          name: pkvalves-website
          path: ./publish/website

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8CD02ACEB92F4EAF94A09A08FF8717A0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1C26AC967C8F428490893EF397E413ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_134FD48166AF4DBFB9BB1A0706E1F0BE }}

      - name: Deploy website
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PKValves'
          slot-name: 'Production'
          package: ./publish/website