name: PK Valves Build and Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet packages
        run: dotnet restore PKValves.sln

      - name: Build solution
        run: dotnet build PKValves.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test PKValves.Tests/PKValves.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal