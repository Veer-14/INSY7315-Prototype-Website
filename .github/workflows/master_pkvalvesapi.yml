name: Build, test and deploy PK Valves API

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkvalves-api-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Download repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore PKValves.sln

      - name: Build solution
        run: dotnet build PKValves.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test PKValves.Tests/PKValves.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Publish API
        run: dotnet publish PKValves.API/PKValves.API.csproj --configuration Release --no-build --no-restore --output ./publish/api

      - name: Upload API deployment files
        uses: actions/upload-artifact@v4
        with:
          name: pkvalves-api
          path: ./publish/api
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy API to Azure
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/master'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API deployment files
        uses: actions/download-artifact@v4
        with:
          name: pkvalves-api
          path: ./publish/api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F9D8E7CCE1F0446B95F19ACFF87BF5F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DA0222F4605A4F5CA73FEC9EECB0A66E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_345F7EB3038E46099D0D8F9CA8AC14DC }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pkvalvesapi'
          slot-name: 'Production'
          package: ./publish/api